[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inter-agent-relay"
version = "0.1.0"
description = "MCP server that logs cross-node inter-agent calls to the context-visualizer"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "requests>=2.31",
]

[project.scripts]
inter-agent-relay = "inter_agent_relay.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inter_agent_relay*"]
