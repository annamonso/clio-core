<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chimaera Dashboard{% endblock %}</title>
    <script>
        // Apply stored theme before first paint so we never flash the wrong
        // palette. Uses the same localStorage key as the workspace SPA
        // (`theme`) so toggling in one place reflects everywhere.
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t !== "light" && t !== "dark") t = "dark";
                document.documentElement.dataset.theme = t;
            } catch (e) {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Chimaera Visualizer</div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Topology</a></li>
            <li><a href="/pools" class="{% if request.path == '/pools' %}active{% endif %}">Pools</a></li>
            <li><a href="/config" class="{% if request.path == '/config' %}active{% endif %}">Config</a></li>
            <li><a href="/recovery" class="{% if request.path == '/recovery' %}active{% endif %}">Recovery</a></li>
            <li><a href="/workspace" class="{% if request.path == '/workspace' %}active{% endif %}">Workspace</a></li>
        </ul>
        <div class="nav-status" id="conn-status">Connecting...</div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
            <span class="theme-icon theme-icon-dark">&#9790;</span>
            <span class="theme-icon theme-icon-light">&#9728;</span>
        </button>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <script>
        (function () {
            var btn = document.getElementById("themeToggle");
            if (!btn) return;
            btn.addEventListener("click", function () {
                var cur = document.documentElement.dataset.theme === "light" ? "light" : "dark";
                var next = cur === "light" ? "dark" : "light";
                document.documentElement.dataset.theme = next;
                try { localStorage.setItem("theme", next); } catch (e) {}
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
